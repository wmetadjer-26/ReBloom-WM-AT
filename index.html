<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReBloom Sukuk — The Deal Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12211A;
    --ink-soft: rgba(18,33,26,0.74);
    --ink-faint: rgba(18,33,26,0.54);
    --white:#FFFFFF;
    --surface:#F6F9F7;
    --line: rgba(18,33,26,0.11);
    --line-strong: rgba(18,33,26,0.20);
    --emerald:#0E9F6E;
    --emerald-dark:#076A49;
    --emerald-tint:#E6F7EF;
    --gold:#C9971E;
    --gold-tint:#FBF1DC;
    --red:#D6483C;
    --red-tint:#FCEAE8;
    --shadow-sm: 0 1px 3px rgba(18,33,26,0.06);
    --shadow-md: 0 10px 26px rgba(18,33,26,0.10);
    --shadow-lg: 0 24px 56px rgba(18,33,26,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--white);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    font-size:15.5px;
    font-weight:500;
    line-height:1.62;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; font-weight:600; letter-spacing:-0.012em; margin:0; color:var(--ink); }
  p{ margin:0 0 14px 0; }
  ::selection{ background:var(--emerald); color:var(--white); }

  .bg-watermark{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(70vw, 900px);
    height:auto;
    opacity:0.05;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  #app{ position:relative; z-index:1; }

  /* ---------- top nav (landing) ---------- */
  .landing-nav{
    display:flex; justify-content:space-between; align-items:center; gap:20px;
    padding:24px 48px; max-width:1180px; margin:0 auto; width:100%; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; }
  .brand .mark{
    width:28px; height:29px; flex:none;
  }
  .brand .mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .designed-by{
    font-size:12.5px; color:var(--ink-faint); font-weight:600;
  }
  .designed-by strong{ color:var(--ink); font-weight:800; }
  .ghost-link{
    font-size:13.5px; font-weight:700; color:var(--ink);
    border:1.5px solid var(--line-strong); padding:9px 16px; border-radius:10px;
    cursor:pointer; background:var(--white); transition:all .15s ease;
  }
  .ghost-link:hover{ border-color:var(--emerald); color:var(--emerald-dark); box-shadow:var(--shadow-sm); }

  /* ---------- hero ---------- */
  .landing-hero{
    max-width:1180px; margin:0 auto; width:100%; padding:28px 48px 20px 48px;
    display:flex; align-items:center; gap:56px;
  }
  @media (max-width:900px){ .landing-hero{ flex-direction:column; align-items:flex-start; padding:20px 24px; } }
  .hero-left{ flex:1.1; }
  .tag-line{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--emerald-dark);
    background:var(--emerald-tint); border:1px solid rgba(14,159,110,0.25);
    padding:7px 14px; border-radius:999px; margin-bottom:22px;
  }
  .landing-hero h1{ font-size:52px; line-height:1.05; margin-bottom:20px; max-width:15ch; }
  .landing-hero h1 em{ font-style:normal; color:var(--emerald); }
  .landing-hero .lede{ font-size:17.5px; color:var(--ink-soft); max-width:52ch; margin-bottom:26px; font-weight:500; }
  .led-by{
    font-size:13.5px; color:var(--ink-faint); margin-bottom:30px;
    border-left:3px solid var(--gold); padding-left:14px; font-weight:600;
  }
  .led-by strong{ color:var(--ink); font-weight:800; }

  .btn{
    font-family:'Manrope',sans-serif; font-weight:800; font-size:15px;
    background:var(--emerald); color:var(--white); border:none; padding:15px 28px;
    border-radius:12px; cursor:pointer; box-shadow:var(--shadow-md); transition:all .15s ease;
  }
  .btn:hover{ background:var(--emerald-dark); transform:translateY(-1px); box-shadow:var(--shadow-lg); }
  .btn:disabled{ background:#E1E7E3; color:var(--ink-faint); box-shadow:none; cursor:not-allowed; transform:none; }
  .btn.line{ background:var(--white); color:var(--ink); border:1.5px solid var(--line-strong); box-shadow:none; }
  .btn.line:hover{ border-color:var(--emerald); color:var(--emerald-dark); background:var(--emerald-tint); }

  .hero-right{ flex:1; display:flex; justify-content:center; }
  .ticket{
    width:100%; max-width:340px; background:var(--white);
    border:1.5px solid var(--line-strong); border-radius:18px; overflow:hidden; box-shadow:var(--shadow-lg);
  }
  .ticket-head{ background:linear-gradient(135deg, var(--emerald-dark), var(--emerald)); color:var(--white); padding:20px 22px; }
  .ticket-head .eyebrow{ font-size:11px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:#D6FFF0; margin-bottom:8px; }
  .ticket-head .amt{ font-family:'Fraunces',serif; font-size:32px; font-weight:700; }
  .ticket-body{ padding:6px 22px 14px 22px; }
  .ticket-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .ticket-row:last-child{ border-bottom:none; }
  .ticket-row .k{ color:var(--ink-faint); font-weight:600; }
  .ticket-row .v{ font-weight:800; }
  .ticket-row .v.ok{ color:var(--emerald-dark); }
  .ticket-row .v.warn{ color:var(--gold); }

  .howitworks-wrap{ max-width:1180px; margin:0 auto; width:100%; padding:10px 48px 60px 48px; }
  @media (max-width:900px){ .howitworks-wrap{ padding:10px 24px 50px 24px; } }

  /* ---------- shell ---------- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:272px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    padding:30px 24px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  @media (max-width:860px){ .shell{ flex-direction:column; } .sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line); } }
  .sidebar .brand{ margin-bottom:32px; }
  .nav-steps{ display:flex; flex-direction:column; margin-bottom:26px; }
  .nav-step{ display:flex; align-items:flex-start; gap:12px; position:relative; padding-bottom:24px; }
  .nav-step::before{ content:''; position:absolute; left:11px; top:26px; bottom:0; width:2px; background:var(--line-strong); }
  .nav-step:last-child::before{ display:none; }
  .nav-step .circ{
    width:23px; height:23px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:800; background:var(--white); border:2px solid var(--line-strong); color:var(--ink-faint); z-index:2;
  }
  .nav-step.active .circ{ background:var(--emerald); border-color:var(--emerald); color:var(--white); box-shadow:0 0 0 4px var(--emerald-tint); }
  .nav-step.done .circ{ background:var(--emerald-dark); border-color:var(--emerald-dark); color:var(--white); }
  .nav-step .lbl{ font-size:13.5px; font-weight:600; padding-top:2px; color:var(--ink-faint); }
  .nav-step.active .lbl{ color:var(--ink); font-weight:800; }
  .nav-step.done .lbl{ color:var(--ink-soft); }

  .sidebar-role{
    border-radius:14px; padding:16px; margin-bottom:14px;
    background:var(--r-tint, var(--surface)); border:1.5px solid var(--r-accent, var(--line-strong));
  }
  .sidebar-role .eyebrow{ font-size:10.5px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--r-accent, var(--emerald-dark)); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .sidebar-role .rname{ font-size:14.5px; font-weight:800; margin-bottom:4px; }
  .sidebar-role .rmandate{ font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  .main{ flex:1; padding:44px 52px 90px 52px; max-width:900px; }
  @media (max-width:860px){ .main{ padding:32px 24px 70px 24px; } }

  .eyebrow{ font-size:12px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:var(--emerald-dark); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .main h2{ font-size:29px; margin-bottom:8px; }
  .sub{ color:var(--ink-soft); font-size:14.5px; margin-bottom:26px; font-weight:500; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 26px; margin-bottom:18px; }
  .card.gold{ border-left:4px solid var(--gold); background:linear-gradient(180deg, var(--gold-tint), var(--surface)); }
  .card ul{ margin:0; padding-left:20px; font-size:14.5px; color:var(--ink-soft); }
  .card li{ margin-bottom:8px; font-weight:500; }
  .card li::marker{ color:var(--emerald); font-weight:800; }

  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  @media (max-width:640px){ .role-grid{ grid-template-columns:1fr; } }
  .role-card{
    text-align:left; background:var(--white); border:1.5px solid var(--line-strong); padding:20px; cursor:pointer;
    font-family:inherit; color:var(--ink); border-radius:16px; display:flex; gap:14px;
    transition:all .15s ease; position:relative;
  }
  .role-card:hover{ border-color:var(--r-accent); box-shadow:var(--shadow-md); transform:translateY(-2px); }
  .role-card.selected{ border-color:var(--r-accent); background:var(--r-tint); box-shadow:0 0 0 3px color-mix(in srgb, var(--r-accent) 22%, transparent); }
  .role-card.selected::after{
    content:'SELECTED'; position:absolute; top:12px; right:14px; font-size:9.5px; font-weight:800;
    letter-spacing:0.05em; color:var(--r-accent);
  }
  .role-icon{ width:42px; height:42px; border-radius:11px; background:var(--r-tint); color:var(--r-accent); display:flex; align-items:center; justify-content:center; flex:none; }
  .role-card h3{ font-size:16px; font-weight:800; margin-bottom:5px; }
  .role-card .mandate{ font-size:13px; color:var(--ink-soft); line-height:1.5; font-weight:500; }

  .detail-row{ display:grid; grid-template-columns:112px 1fr; gap:14px; padding:12px 0; border-top:1px solid var(--line); font-size:14px; }
  .detail-row:first-child{ border-top:none; padding-top:2px; }
  .detail-row .label{ font-weight:800; color:var(--r-accent, var(--emerald-dark)); font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding-top:2px; }
  .detail-row .val{ color:var(--ink-soft); font-weight:500; }

  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0 22px 0; }
  @media (max-width:640px){ .choice-grid{ grid-template-columns:1fr; } }
  .choice{
    display:flex; align-items:flex-start; gap:12px; padding:16px 18px; border:1.5px solid var(--line-strong);
    border-radius:14px; cursor:pointer; background:var(--white); font-family:inherit; text-align:left;
    color:var(--ink); font-size:14.5px; font-weight:700; transition:all .15s ease;
  }
  .choice:hover{ border-color:var(--emerald); }
  .choice .dot{ width:19px; height:19px; border-radius:50%; border:2px solid var(--line-strong); flex:none; margin-top:1px; position:relative; }
  .choice.selected{ border-color:var(--emerald); background:var(--emerald-tint); }
  .choice.selected .dot{ border-color:var(--emerald); background:var(--emerald); }
  .choice.selected .dot::after{ content:''; position:absolute; left:5px; top:5px; width:5px; height:5px; border-radius:50%; background:var(--white); }

  label.field-label{ display:block; font-size:12.5px; font-weight:800; color:var(--emerald-dark); margin-bottom:9px; letter-spacing:0.02em; text-transform:uppercase; }
  textarea{
    width:100%; font-family:inherit; font-size:14.5px; font-weight:500; padding:13px 15px;
    border:1.5px solid var(--line-strong); border-radius:12px; background:var(--white); color:var(--ink); resize:vertical; min-height:70px;
  }
  textarea::placeholder{ color:var(--ink-faint); }
  textarea:focus{ outline:2px solid var(--emerald); outline-offset:1px; }

  .reveal-row{
    display:flex; gap:22px; align-items:center; padding:22px 24px; border:1.5px solid #F0C4BC;
    border-radius:16px; background:linear-gradient(135deg, var(--red-tint), #FFF9F8); margin-bottom:16px;
  }
  .reveal-row .big{ font-family:'Fraunces',serif; font-size:46px; font-weight:700; color:var(--red); flex:none; min-width:110px; }
  .reveal-row .txt{ font-size:14.5px; color:var(--ink-soft); font-weight:500; }
  .reveal-row .txt strong{ display:block; color:var(--ink); font-size:15px; margin-bottom:3px; font-weight:800; }

  table.map-table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:12px 0 6px 0; }
  table.map-table th, table.map-table td{ text-align:left; padding:11px 12px; border-top:1px solid var(--line); vertical-align:top; color:var(--ink-soft); font-weight:500; }
  table.map-table th{ color:var(--emerald-dark); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }
  tr.you{ background:var(--emerald-tint); }
  tr.you td:first-child{ font-weight:800; color:var(--ink); }

  .mechanism-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0 24px 0; }
  @media (max-width:640px){ .mechanism-grid{ grid-template-columns:1fr; } }
  .mech{ padding:18px; background:var(--white); border:1px solid var(--line); border-left:4px solid var(--mech-color, var(--emerald)); border-radius:12px; font-size:13.5px; color:var(--ink-soft); font-weight:500; box-shadow:var(--shadow-sm); }
  .mech .title{ font-weight:800; color:var(--ink); margin-bottom:5px; font-size:14.5px; font-family:'Manrope',sans-serif; }

  .summary-line{ display:flex; gap:10px; align-items:baseline; font-size:14.5px; margin-bottom:8px; font-weight:500; }
  .summary-line .tag{ background:var(--emerald-dark); color:var(--white); padding:3px 11px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:0.02em; }

  .actions{ display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; }
  footer.note{ font-size:12.5px; color:var(--ink-faint); margin-top:38px; border-top:1px solid var(--line); padding-top:18px; font-weight:500; }

  .dash-row{ border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; background:var(--surface); }
  .dash-row .meta{ font-size:11.5px; color:var(--ink-faint); margin-bottom:8px; font-weight:700; }
  .empty-state{ padding:50px 20px; text-align:center; color:var(--ink-faint); border:1.5px dashed var(--line-strong); border-radius:16px; font-size:14.5px; font-weight:600; }
  .role-tally{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
  .stat-chip-role{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:var(--ink);
    background:var(--r-tint); border:1px solid var(--r-accent); padding:8px 14px; border-radius:999px;
  }
  .stat-chip-role .rdot{ width:8px; height:8px; border-radius:50%; }
  .stat-chip-role b{ font-family:'Fraunces',serif; font-size:15px; margin-left:2px; }

  .lens-badge{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    color:var(--emerald-dark); margin-bottom:18px;
  }
  .lens-badge .dot2{ width:7px; height:7px; border-radius:50%; background:var(--gold); flex:none; }

  .chapter-kicker{
    font-size:12px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:6px;
  }

  .decision-map{ display:flex; flex-direction:column; gap:10px; margin:14px 0 8px 0; }
  .dm-row{ display:flex; align-items:center; gap:14px; }
  .dm-label{ width:150px; flex:none; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-align:right; }
  .dm-chip{
    flex:1; padding:10px 14px; border-radius:10px; font-size:13.5px; font-weight:700;
    border:1.5px solid var(--line-strong); background:var(--white); color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .dm-chip .tag2{ font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px; color:var(--white); }
  .dm-chip.c-approve{ border-color:#1E9E5C; background:#EEFBF3; }
  .dm-chip.c-approve .tag2{ background:#1E9E5C; }
  .dm-chip.c-conditions{ border-color:#C9971E; background:#FDF7E8; }
  .dm-chip.c-conditions .tag2{ background:#C9971E; }
  .dm-chip.c-decline{ border-color:#C43D3D; background:#FDEDEC; }
  .dm-chip.c-decline .tag2{ background:#C43D3D; }
  .dm-chip.c-escalate{ border-color:#3462C6; background:#EDF2FC; }
  .dm-chip.c-escalate .tag2{ background:#3462C6; }
</style>
</head>

            <div class="ticket-row"><span class="k">Outcome threshold</span><span class="v warn">? Unverified</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="howitworks-wrap" id="howitworks">
      <div class="card gold">
        <div class="eyebrow" style="color:var(--gold);">How this works</div>
        <p style="margin:0; font-size:14.5px;">Pick a role, then move through five chapters — each a distinct
        situation with its own decision. Approve, condition, decline, or escalate at each one. Run it solo, or
        as a group with one role per table — everyone compares their full decision map at the debrief.</p>
      </div>
      <footer class="note">A teaching case study interactive for applied ethics in climate action —
      developed for the 5th AlBaraka Summit workshop.</footer>
    </div>`;
}

/* ---------- ROLES ---------- */
function renderRoles(){
  const selected = state.roleId;
  return `<div class="shell">${sidebar()}
    <div class="main">
      <div class="eyebrow">Step 01</div>
      <h2>Choose your seat at the table</h2>
      <p class="sub">Each role sees the same public prospectus, plus one private fact and one incentive the
      others don't have — carried with you across all five chapters.</p>
      <div class="role-grid">
        ${ROLES.map(r=>`
          <button class="role-card ${selected===r.id?'selected':''}" style="--r-accent:${r.accent}; --r-tint:${r.tint};" onclick="selectRole('${r.id}')">
            <div class="role-icon">${ICONS[r.icon]}</div>
            <div><h3>${r.name}</h3><div class="mandate">${r.mandate}</div></div>
          </button>`).join('')}
      </div>
      ${selected ? roleDetail(role(selected)) : ''}
      ${selected ? `
      <div class="card">
        <label class="field-label">Your name or table number (shown on the live dashboard)</label>
        <input type="text" id="nameInput" value="${state.playerName}" placeholder="e.g. Table 3, or your name"
          oninput="state.playerName=this.value"
          style="width:100%; font-family:inherit; font-size:14.5px; font-weight:600; padding:12px 14px; border:1.5px solid var(--line-strong); border-radius:12px; background:var(--white); color:var(--ink);">
        <p style="margin:10px 0 0 0; font-size:12px; color:var(--ink-faint); font-weight:600;">Visible to everyone
        watching the live dashboard for this session — leave blank to stay anonymous.</p>
      </div>` : ''}
      <div class="actions">
        <button class="btn" ${selected?'':'disabled'} onclick="go('ch1')">Enter the deal room →</button>
      </div>
    </div>
  </div>`;
}
function roleDetail(r){
  return `<div class="card" style="--r-accent:${r.accent};">
    <div class="eyebrow" style="color:${r.accent};">${ICONS[r.icon]} Private brief</div>
    <div class="detail-row" style="--r-accent:${r.accent};"><div class="label">Fact</div><div class="val">${r.fact}</div></div>
    <div class="detail-row" style="--r-accent:${r.accent};"><div class="label">Incentive</div><div class="val">${r.incentive}</div></div>
  </div>`;
}

/* ---------- CHAPTER (decision) SCREENS ---------- */
function renderChapter(chapterId){
  const ch = chapterById(chapterId);
  const r = role(state.roleId);
  const stepNum = stepIndex() + 1;
  const factsHTML = ch.isReconsider
    ? `<p style="margin:0; font-size:14.5px;">Same programme, now with the disclosure from the last screen
       factored in. Reconsider from your role's mandate.</p>`
    : `<ul>${ch.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`;
  const key = ch.key;
  const isLast = chapterId === 'ch5';

  return `<div class="shell">${sidebar()}
    <div class="main">
      <div class="eyebrow">Step ${String(stepNum).padStart(2,'0')}</div>
      <div class="chapter-kicker">${ch.title}</div>
      <h2 style="margin-bottom:10px;">${ch.isReconsider ? 'What has changed' : 'What the room knows'}</h2>
      <div class="lens-badge"><span class="dot2"></span>${ch.lens}</div>
      <p class="sub" style="margin-top:-8px;">Playing as <strong style="color:${r.accent};">${r.name}</strong></p>
      <div class="card">${factsHTML}</div>
      <label class="field-label">${ch.prompt}</label>
      <div class="choice-grid">
        ${ch.options.map(c=>`
          <button class="choice ${state.decisions[key].choice===c.id?'selected':''}" onclick="pickChoice('${key}','${c.id}')">
            <span class="dot"></span>${c.label}
          </button>`).join('')}
      </div>
      <label class="field-label">In one sentence, why? (optional)</label>
      <textarea placeholder="Your reasoning..." oninput="state.decisions.${key}.reason=this.value">${state.decisions[key].reason}</textarea>
      <div class="actions" style="margin-top:20px;">
        <button class="btn" ${state.decisions[key].choice?'':'disabled'} onclick="${
          chapterId==='ch1' ? "go('reveal')" :
          isLast ? "finishGame()" :
          `go('${SCREEN_ORDER[SCREEN_ORDER.indexOf(chapterId)+1]}')`
        }">
          ${isLast ? 'Finish — see my decision map →' : 'Lock in this decision →'}
        </button>
      </div>
    </div>
  </div>`;
}

/* ---------- REVEAL (between ch1 and ch2) ---------- */
function renderReveal(){
  return `<div class="shell">${sidebar()}
    <div class="main">
      <div class="eyebrow">Step 03</div>
      <div class="chapter-kicker">Chapter 2 — The Disclosure</div>
      <h2 style="margin-bottom:16px;">A disclosure comes in</h2>
      <div class="reveal-row">
        <div class="big" id="num1">0%</div>
        <div class="txt"><strong>Actual sapling survival</strong> after two years — well below
        the 65–75% typically required for a credible restoration or carbon claim. This wasn't in the summary
        investors were shown.</div>
      </div>
      <div class="reveal-row">
        <div class="big" id="num2">0%</div>
        <div class="txt"><strong>The outcome tranche's survival verification threshold</strong>, quietly lowered
        from 65% shortly before the verification date — so the grant's first-loss buffer was never drawn down,
        and the shortfall never showed up in the programme's own risk reporting.</div>
      </div>
      <p style="font-size:14.5px;">Go back to your role. Does this change your answer?</p>
      <div class="actions"><button class="btn" onclick="go('ch2')">Reconsider — Chapter 2 →</button></div>
    </div>
  </div>`;
}
function animateReveal(){ countUp('num1', 18, '%'); countUp('num2', 40, '%'); }
function countUp(id, target, suffix){
  const el = document.getElementById(id); if(!el) return;
  let cur = 0; const step = Math.max(1, Math.round(target/24));
  const t = setInterval(()=>{ cur += step; if(cur>=target){cur=target; clearInterval(t);} el.textContent = cur+suffix; }, 30);
}

async function finishGame(){ await saveRun(); go('debrief'); }

/* ---------- DEBRIEF ---------- */
function choiceClass(choiceId){
  return {approve:'c-approve', conditions:'c-conditions', decline:'c-decline', escalate:'c-escalate'}[choiceId] || '';
}
function choiceTagLabel(choiceId){
  return {approve:'APPROVE', conditions:'CONDITIONS', decline:'DECLINE', escalate:'ESCALATE'}[choiceId] || '—';
}

function renderDebrief(){
  const r = role(state.roleId);
  const chapterKeys = ['ch1','ch2','ch3','ch4','ch5'];
  const shifts = chapterKeys.slice(1).filter((k,i)=> state.decisions[k].choice !== state.decisions[chapterKeys[i]].choice).length;

  return `<div class="shell">${sidebar()}
    <div class="main">
      <div class="eyebrow">Step 08</div>
      <h2>Your decision map</h2>
      <p class="sub">You played <strong style="color:${r.accent};">${r.name}</strong> across all five chapters</p>

      <div class="card">
        <div class="eyebrow" style="color:${r.accent};">${ICONS[r.icon]} Full journey</div>
        <div class="decision-map">
          ${chapterKeys.map(k=>{
            const ch = chapterById(k);
            const d = state.decisions[k];
            const opt = ch.options.find(o=>o.id===d.choice);
            return `<div class="dm-row">
              <div class="dm-label">Ch.${ch.number}</div>
              <div class="dm-chip ${choiceClass(d.choice)}">
                <span>${opt ? opt.label : '—'}${d.reason ? ` — "${d.reason}"` : ''}</span>
                <span class="tag2">${choiceTagLabel(d.choice)}</span>
              </div>
            </div>`;
          }).join('')}
        </div>
        <p style="margin-top:14px; margin-bottom:0; font-size:14.5px;">
          Your position changed <strong>${shifts}</strong> time${shifts===1?'':'s'} across the four chapter-to-chapter
          transitions. ${shifts >= 3
            ? 'A highly responsive pattern — worth asking whether each shift tracked new evidence, or just new pressure.'
            : shifts === 0
              ? 'A fully consistent pattern — worth asking whether that consistency reflects a firm principle, or a role whose mandate never required it to look closer.'
              : 'A moderate pattern — some chapters moved you, others didn\'t. Which ones, and why?'}
        </p>
      </div>

      <div class="card"><div class="eyebrow">Where your role sits in the structure</div><p style="margin:0; font-size:14.5px;">${r.pillar}</p></div>

      <h3 style="font-size:18px; margin:28px 0 8px 0;">Every chapter's ethical lens</h3>
      <table class="map-table">
        <tr><th>Chapter</th><th>What it tests</th></tr>
        ${CHAPTERS.map(c=>`<tr><td>Ch.${c.number} — ${c.title.split('— ')[1]}</td><td>${c.lens}</td></tr>`).join('')}
      </table>

      <h3 style="font-size:18px; margin:28px 0 4px 0;">The mechanisms, named</h3>
      <div class="mechanism-grid">
        ${MECHANISMS.map(m=>`<div class="mech" style="--mech-color:${m.color};"><div class="title">${m.title}</div>${m.body}</div>`).join('')}
      </div>

      <div class="card gold">
        <div class="eyebrow" style="color:var(--gold);">Closing question</div>
        <p style="margin:0; font-size:14.5px;">Looking at your own five-chapter map: which single chapter, if
        someone outside the programme had a formal veto over it, would have changed the whole outcome?</p>
      </div>

      <div class="actions">
        <button class="btn line" onclick="restart()">Play another role</button>
        <button class="btn" onclick="go('dashboard')">View facilitator dashboard →</button>
      </div>
    </div>
  </div>`;
}

function roleTallyHTML(runs){
  return ROLES.map(r=>{
    const count = runs.filter(x=>x.roleId===r.id).length;
    return `<div class="stat-chip-role" style="--r-accent:${r.accent}; --r-tint:${r.tint};">
      <span class="rdot" style="background:${r.accent};"></span>${r.name.split(' (')[0]}
      <b>${count}</b>
    </div>`;
  }).join('');
}

async function refreshDashboard(){
  const el = document.getElementById('dashboard-content');
  if(!el) return;
  const runs = await loadSharedRuns();
  const el2 = document.getElementById('dashboard-content');
  if(!el2) return;
  if(runs === 'unconfigured'){
    el2.innerHTML = `<div class="empty-state">No live database is connected yet. Find
    <code>FIREBASE_DB_URL</code> near the top of this file's script and paste in your Firebase Realtime
    Database URL to turn on the live dashboard.</div>`;
    return;
  }
  if(runs === null){
    el2.innerHTML = `<div class="empty-state">Couldn't reach the live store just now. Trying again shortly —
    use "Refresh now" to retry immediately.</div>`;
    return;
  }
  if(runs.length === 0){
    el2.innerHTML = `<div class="empty-state">No decisions submitted yet this session. As people finish all
    five chapters, they'll appear here automatically.</div>`;
    return;
  }
  el2.innerHTML = `
    <div class="role-tally">${roleTallyHTML(runs)}</div>
    ${runs.map(run=>{
      const r = role(run.roleId);
      const chapterKeys = ['ch1','ch2','ch3','ch4','ch5'];
      const chipsHTML = chapterKeys.map(k=>{
        const d = run.decisions ? run.decisions[k] : null;
        const ch = chapterById(k);
        const opt = d && ch.options.find(o=>o.id===d.choice);
        return `<span class="dm-chip ${choiceClass(d && d.choice)}" style="flex:none; padding:6px 10px; font-size:11.5px;">
          Ch.${ch.number} <span class="tag2" style="margin-left:6px;">${choiceTagLabel(d && d.choice)}</span>
        </span>`;
      }).join('');
      return `<div class="dash-row" style="border-left:4px solid ${r.accent};">
        <div class="meta">${new Date(run.ts).toLocaleTimeString()} ${run.playerName?`· ${run.playerName}`:''}</div>
        <strong style="font-size:15px; color:${r.accent};">${r.name}</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">${chipsHTML}</div>
      </div>`;
    }).join('')}
  `;
}

function startDashboardPolling(){
  stopDashboardPolling();
  refreshDashboard();
  dashboardTimer = setInterval(refreshDashboard, 4000);
}
function stopDashboardPolling(){
  if(dashboardTimer){ clearInterval(dashboardTimer); dashboardTimer = null; }
}
function confirmClearRuns(){
  if(confirm('Clear every submitted decision for everyone in this session? This cannot be undone.')){
    clearSharedRuns();
  }
}

/* ---------- actions ---------- */
function selectRole(id){ state.roleId = id; render(); }
function pickChoice(key, choiceId){ state.decisions[key].choice = choiceId; render(); }
function restart(){
  state = { screen:'roles', roleId:null, playerName:'',
    decisions:{ ch1:{choice:null,reason:''}, ch2:{choice:null,reason:''}, ch3:{choice:null,reason:''}, ch4:{choice:null,reason:''}, ch5:{choice:null,reason:''} } };
  render();
}

/* ---------- backend (Firebase Realtime Database REST) ---------- */
function backendConfigured(){
  return FIREBASE_DB_URL && FIREBASE_DB_URL.indexOf('PASTE_YOUR_FIREBASE_URL_HERE') === -1;
}

async function saveRun(){
  if(!backendConfigured()) return;
  const key = `run_${state.roleId}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
  const value = {
    ts: Date.now(),
    roleId: state.roleId,
    playerName: state.playerName || '',
    decisions: state.decisions
  };
  try{
    await fetch(`${FIREBASE_DB_URL}/runs/${key}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(value)
    });
  }catch(e){
    console.error('Failed to save run', e);
  }
}

async function loadSharedRuns(){
  if(!backendConfigured()) return 'unconfigured';
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/runs.json`);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    if(!data) return [];
    const runs = Object.values(data);
    runs.sort((a,b)=> b.ts - a.ts);
    return runs;
  }catch(e){
    console.error('Failed to load shared runs', e);
    return null;
  }
}

async function clearSharedRuns(){
  if(!backendConfigured()) return;
  try{
    await fetch(`${FIREBASE_DB_URL}/runs.json`, { method: 'DELETE' });
  }catch(e){ console.error('Failed to clear shared runs', e); }
  await refreshDashboard();
}

/* ---------- render dispatch ---------- */
function render(){
  const app = document.getElementById('app');
  const screens = {
    landing: renderLanding,
    roles: renderRoles,
    ch1: ()=>renderChapter('ch1'),
    reveal: renderReveal,
    ch2: ()=>renderChapter('ch2'),
    ch3: ()=>renderChapter('ch3'),
    ch4: ()=>renderChapter('ch4'),
    ch5: ()=>renderChapter('ch5'),
    debrief: renderDebrief,
    dashboard: renderDashboard
  };
  app.innerHTML = (screens[state.screen] || renderLanding)();
  if(state.screen === 'reveal'){ setTimeout(animateReveal, 100); }
  if(state.screen === 'dashboard'){ startDashboardPolling(); } else { stopDashboardPolling(); }
}
render();
</script>

</body>
</html>
